# Testes e build. Roda em pull requests e é reutilizado pelo workflow de bump (push na main).
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  commits:
    name: Mensagens de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Instalar commitizen
        run: pip install "commitizen==4.19.3"

      - name: Validar commits do PR (Conventional Commits)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cz check --rev-range "origin/${BASE_REF}..HEAD"

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Rodar testes
        run: dotnet test --project RemoteMan.Tests/RemoteMan.Tests.csproj -c Release

  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Compilar
        run: dotnet build RemoteMan/RemoteMan.csproj -c Release -p:Platform=${{ matrix.platform }}
