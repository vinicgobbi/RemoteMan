# Publica o app (instalador .exe e zip portátil por plataforma) e cria o GitHub Release com as notas do CHANGELOG.
# Chamado pelo workflow de bump ou disparado por push manual de uma tag v* (ex.: v0.1.0).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: "Versão sem o v (ex.: 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prepare:
    name: Versão
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versão inválida: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publicar (${{ matrix.rid }})
    needs: prepare
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: x64
            arch: x64
          - rid: win-arm64
            platform: ARM64
            arch: arm64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RID: ${{ matrix.rid }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: dotnet publish
        shell: pwsh
        run: >
          dotnet publish RemoteMan/RemoteMan.csproj -c Release
          -r $env:RID -p:Platform=$env:PLATFORM --self-contained
          -p:Version=$env:VERSION -p:DebugType=none -o "publish/$env:RID"

      # WinUI 3 não funciona com PublishSingleFile: o "exe único" é o instalador.
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --version 6.7.1 --yes --no-progress

      - name: Gerar instalador
        shell: pwsh
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          "/DAppVersion=$env:VERSION" "/DArch=$env:ARCH"
          "/DPublishDir=..\publish\$env:RID" "/DOutputDir=..\dist"
          installer\RemoteMan.iss

      - name: Gerar zip portátil
        shell: pwsh
        run: Compress-Archive -Path "publish/$env:RID/*" -DestinationPath "dist/RemoteMan-$env:VERSION-$env:ARCH-portable.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RemoteMan-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Notas da versão (seção do CHANGELOG.md)
        run: |
          awk -v header="## v${VERSION} " '
            index($0, header) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Versão ${VERSION} sem entrada no CHANGELOG.md." > notes.md
          fi
          cat notes.md

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: RemoteMan-*
          path: dist
          merge-multiple: true

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "RemoteMan ${VERSION}" \
            --notes-file notes.md \
            --verify-tag
