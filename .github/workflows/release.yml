# Publica o app (zip self-contained por plataforma) e cria o GitHub Release com as notas do CHANGELOG.
# Chamado pelo workflow de bump ou disparado por push manual de uma tag v* (ex.: v0.1.0).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: "Versão sem o v (ex.: 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prepare:
    name: Versão
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versão inválida: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publicar (${{ matrix.rid }})
    needs: prepare
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RID: ${{ matrix.rid }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: dotnet publish
        shell: pwsh
        run: >
          dotnet publish RemoteMan/RemoteMan.csproj -c Release
          -r $env:RID -p:Platform=$env:PLATFORM --self-contained
          -p:Version=$env:VERSION -o publish

      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "RemoteMan-$env:VERSION-$env:RID.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RemoteMan-${{ matrix.rid }}
          path: RemoteMan-*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Notas da versão (CHANGELOG)
        run: |
          pip install "commitizen==4.19.3"
          cz changelog "$VERSION" --dry-run > notes.md

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: RemoteMan-*
          path: dist
          merge-multiple: true

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${VERSION}" dist/*.zip \
            --title "RemoteMan ${VERSION}" \
            --notes-file notes.md \
            --verify-tag
